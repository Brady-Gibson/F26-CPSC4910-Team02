<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cart · TigerTruck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../">
<div class="shell"><aside class="rail" id="rail"></aside><main id="main" tabindex="-1"><div class="loading">Loading…</div></main></div>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgBody"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
VIEWS.driver.cart = () => {
  const d = myDriver(), items = cartItems();
  const total = items.reduce((a,i)=>a+i.quantity*i.point_price_snapshot,0), after = d.current_points-total;
  return `<div class="head"><div><h1>Cart</h1><p class="sub">Prices are locked when you add an item.</p></div></div>
  ${items.length?`<div class="grid g2"><div class="panel flush"><div class="tw"><table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Points</th><th></th></tr></thead><tbody>
    ${items.map(i=>`<tr><td>${esc(product(i.product_id).product_name)}</td><td class="num"><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-q="${i.product_id}" data-d="-1" aria-label="Decrease">−</button>${i.quantity}<button class="btn ghost sm" data-q="${i.product_id}" data-d="1" aria-label="Increase">+</button></div></td>
    <td class="num">${n(i.quantity*i.point_price_snapshot)}</td><td class="num"><button class="btn danger sm" data-rm="${i.product_id}">Remove</button></td></tr>`).join("")}</tbody></table></div></div>
    <div class="panel"><h2>Summary</h2>
      <div class="row spread"><span>Total</span><b>${n(total)} pts</b></div>
      <div class="row spread"><span>Balance now</span><span>${n(d.current_points)} pts</span></div>
      <div class="row spread" style="margin-bottom:14px"><span>Balance after</span><b class="${after<0?"minus":""}">${n(after)} pts</b></div>
      ${after<0?`<p class="minus" style="margin-top:0">You need ${n(-after)} more points for this order.</p>`:""}
      <button class="btn go" id="place" ${after<0?"disabled":""} style="width:100%">Place order</button>
      ${src("shopping_cart","cart_item","customer_order","order_item","point_transaction")}</div></div>`
  :`<div class="panel empty">Your cart is empty. <a href="${ROOT}driver/catalog.html">Browse the catalog</a> to find something.</div>`}`;
};

bind.driver.cart = () => {
  const c = activeCart(false); if(!c) return;
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const i=DB.cart_item.find(x=>x.cart_id===c.cart_id&&x.product_id===+b.dataset.q); i.quantity+= +b.dataset.d; if(i.quantity<1) DB.cart_item.splice(DB.cart_item.indexOf(i),1); App.render();});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{DB.cart_item=DB.cart_item.filter(x=>!(x.cart_id===c.cart_id&&x.product_id===+b.dataset.rm)); App.render();});
  $("#place")&&($("#place").onclick=()=>{
    const d=myDriver(), items=cartItems(), s=sponsor(d.sponsor_id), oid=nextId("customer_order","order_id");
    const tp=items.reduce((a,i)=>a+i.quantity*i.point_price_snapshot,0);
    const td=items.reduce((a,i)=>a+i.quantity*product(i.product_id).dollar_price,0);
    if(!addPoints(d.driver_id,d.sponsor_id,-tp,`Redeemed: order #${oid}`,d.driver_id)) return;
    DB.customer_order.push({order_id:oid,driver_id:d.driver_id,sponsor_id:s.sponsor_id,placed_by_user_id:d.driver_id,status:"PLACED",total_points:tp,total_dollar_amount:+td.toFixed(2),placed_at:now(),cancelled_at:null});
    items.forEach((i,k)=>DB.order_item.push({order_id:oid,line_number:k+1,sponsor_id:i.sponsor_id,product_id:i.product_id,quantity:i.quantity,unit_point_price:i.point_price_snapshot,unit_dollar_price:product(i.product_id).dollar_price}));
    c.status="CHECKED_OUT"; toast(`Order #${oid} placed`); App.go("driver/orders");
  });
};

App.start("driver", "cart");
</script>
</body>
</html>
