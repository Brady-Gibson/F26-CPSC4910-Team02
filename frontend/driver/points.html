<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Point history · TigerTruck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-root="../">
<div class="shell"><aside class="rail" id="rail"></aside><main id="main" tabindex="-1"><div class="loading">Loading…</div></main></div>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgBody"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
VIEWS.driver.points = () => `<div class="head"><div><h1>Point history</h1><p class="sub">Every change to your balance and why it happened.</p></div></div>
  <div class="panel flush">${txTable(DB.point_transaction.filter(t=>t.driver_id===ME.driver).sort(byNewest))}</div>${src("point_transaction")}`;

App.start("driver", "points");
</script>
