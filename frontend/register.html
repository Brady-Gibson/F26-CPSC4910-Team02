<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · TigerTruck</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>

<body class="auth" data-root="">
<main class="auth-main">
  <div class="auth-card">
    <h2>Create Driver Account</h2>

    <p class="dim">
      Register as a driver. After signing in, you can apply to a sponsor.
    </p>

    <form id="registerForm">
      <div class="auth-err" id="err"></div>

      <label class="field">
        First name
        <input id="firstName" type="text" required>
      </label>

      <label class="field">
        Last name
        <input id="lastName" type="text" required>
      </label>

      <label class="field">
        Username
        <input id="username" type="text" required>
      </label>

      <label class="field">
        Email
        <input id="email" type="email" autocomplete="email" required>
      </label>

      <label class="field">
        Phone
        <input id="phone" type="tel">
      </label>

      <label class="field">
        Password
        <input id="password" type="password" autocomplete="new-password" aria-describedby="passwordRequirements" required>
      </label>
      <ul id="passwordRequirements" class="password-checklist" aria-label="Password requirements">
        <li data-rule="length"><span class="requirement-icon" aria-hidden="true">○</span>At least 8 characters<span class="requirement-status">: not met</span></li>
        <li data-rule="upper"><span class="requirement-icon" aria-hidden="true">○</span>Uppercase letter<span class="requirement-status">: not met</span></li>
        <li data-rule="lower"><span class="requirement-icon" aria-hidden="true">○</span>Lowercase letter<span class="requirement-status">: not met</span></li>
        <li data-rule="number"><span class="requirement-icon" aria-hidden="true">○</span>Number<span class="requirement-status">: not met</span></li>
        <li data-rule="symbol"><span class="requirement-icon" aria-hidden="true">○</span>Symbol<span class="requirement-status">: not met</span></li>
      </ul>

      <label class="field">
        Confirm password
        <input id="confirmPassword" type="password" autocomplete="new-password" aria-describedby="passwordMatch" required>
        <span id="passwordMatch" role="status" aria-live="polite" style="font-weight:400"></span>
      </label>

      <button class="btn go" type="submit" id="submit">
        Create account
      </button>
    </form>

    <p style="margin-top:18px">
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>
  </div>
</main>

<script>
const passwordInput = document.querySelector("#password");
const confirmPasswordInput = document.querySelector("#confirmPassword");
function updatePasswordRequirements() {
  const value = passwordInput.value;
  const checks = {
    length: Array.from(value).length >= 8,
    upper: /[A-Z]/.test(value),
    lower: /[a-z]/.test(value),
    number: /[0-9]/.test(value),
    symbol: /[^A-Za-z0-9]/.test(value)
  };
  document.querySelectorAll("#passwordRequirements li").forEach(item => {
    const met = checks[item.dataset.rule];
    item.classList.toggle("is-met", met);
    item.querySelector(".requirement-icon").textContent = met ? "✓" : "○";
    item.querySelector(".requirement-status").textContent = met ? ": met" : ": not met";
  });
}
passwordInput.addEventListener("input", updatePasswordRequirements);
passwordInput.addEventListener("change", updatePasswordRequirements);
window.addEventListener("pageshow", updatePasswordRequirements);
updatePasswordRequirements();
function updatePasswordMatch() {
  const message = document.querySelector("#passwordMatch");
  const hasConfirmation = confirmPasswordInput.value.length > 0;
  const matches = passwordInput.value === confirmPasswordInput.value;
  message.textContent = hasConfirmation ? (matches ? "Passwords match." : "Passwords do not match yet.") : "";
  message.style.color = hasConfirmation && !matches ? "var(--red)" : "";
}
passwordInput.addEventListener("input", updatePasswordMatch);
confirmPasswordInput.addEventListener("input", updatePasswordMatch);
updatePasswordMatch();

document.querySelector("#registerForm").onsubmit = async (event) => {
  event.preventDefault();

  const errorBox = document.querySelector("#err");
  const submit = document.querySelector("#submit");

  errorBox.textContent = "";
  submit.disabled = true;
  submit.textContent = "Creating account…";

  const response = await fetch("/api/register/driver", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    credentials: "same-origin",
    body: JSON.stringify({
      first_name: document.querySelector("#firstName").value,
      last_name: document.querySelector("#lastName").value,
      username: document.querySelector("#username").value,
      email: document.querySelector("#email").value,
      phone: document.querySelector("#phone").value,
      password: document.querySelector("#password").value,
      confirm_password: document.querySelector("#confirmPassword").value
    })
  });

  const data = await response.json();

  if (!response.ok) {
    errorBox.textContent = data.error || "Unable to create account.";
    submit.disabled = false;
    submit.textContent = "Create account";
    return;
  }

  window.location.href = "login.html";
};
</script>
</body>
</html>
