<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sponsors · TigerTruck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../">
<div class="shell"><aside class="rail" id="rail"></aside><main id="main" tabindex="-1"><div class="loading">Loading…</div></main></div>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgBody"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
/* LIVE: GET /api/admin/sponsors, POST /api/admin/sponsors, PATCH /api/admin/sponsors/<id> (edit, activate, deactivate) */
let sponsorRows = [];

function mockSponsors(){
  return { sponsors: DB.sponsor_organization.map(s => { const ds = DB.driver.filter(d=>d.sponsor_id===s.sponsor_id&&d.participation_status==="ACTIVE");
    return { ...s, drivers: ds.length, sponsor_users: DB.sponsor_user.filter(u=>u.sponsor_id===s.sponsor_id).length,
             points_outstanding: ds.reduce((a,d)=>a+d.current_points,0), pending_applications: 0 }; }) };
}

VIEWS.admin.sponsors = async () => {
  ({ sponsors: sponsorRows } = LIVE ? await App.api("/api/admin/sponsors") : mockSponsors());
  return `<div class="head"><div><h1>Sponsors</h1><p class="sub">Organizations using the program. Deactivating a sponsor hides it from drivers but keeps its history.</p></div><button class="btn go" id="addSponsor">Add sponsor</button></div>
  <div class="panel flush"><div class="tw"><table><thead><tr><th>Sponsor</th><th>Status</th><th class="num">Drivers</th><th class="num">Sponsor users</th><th class="num">Pending apps</th><th class="num">1 point</th><th class="num">Points outstanding</th><th></th></tr></thead><tbody>
  ${sponsorRows.map(s=>`<tr><td><b>${esc(s.sponsor_name)}</b><br><span class="dim">${esc(s.contact_email || "No contact email")}${s.phone ? " · " + esc(s.phone) : ""}</span></td><td>${badge(s.status)}</td>
    <td class="num">${n(s.drivers)}</td><td class="num">${n(s.sponsor_users)}</td><td class="num">${n(s.pending_applications)}</td><td class="num">${usd(s.point_dollar_rate)}</td>
    <td class="num">${n(s.points_outstanding)}</td><td class="num"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">
      <button class="btn ghost sm" data-edit="${s.sponsor_id}">Edit</button>
      <button class="btn ${s.status==="ACTIVE"?"danger":"ghost"} sm" data-st="${s.sponsor_id}">${s.status==="ACTIVE"?"Deactivate":"Activate"}</button></div></td></tr>`).join("")
    || `<tr><td colspan="8" class="empty">No sponsors yet.</td></tr>`}
  </tbody></table></div></div>${src("sponsor_organization","driver_sponsor","sponsor_user")}`;
};

async function setSponsorStatus(s){
  const to = s.status === "ACTIVE" ? "INACTIVE" : "ACTIVE";
  if (to === "INACTIVE" && !confirm(`Deactivate ${s.sponsor_name}? Its drivers won't see its catalog and new drivers can't apply until you activate it again.`)) return;
  try {
    if (LIVE) await App.api(`/api/admin/sponsors/${s.sponsor_id}`, { method: "PATCH", body: { status: to } });
    else sponsor(s.sponsor_id).status = to;
    toast(`${s.sponsor_name} ${to === "ACTIVE" ? "activated" : "deactivated"}`); App.render();
  } catch (e) { toast(e.message); }
}

function editSponsorDialog(s){
  const form = $("#dlgBody"), dlg = $("#dlg");
  form.innerHTML = `<h2 style="margin:0">Edit ${esc(s.sponsor_name)}</h2>
    <label class="field">Company name<input type="text" id="esName" maxlength="100" required value="${esc(s.sponsor_name)}"></label>
    <label class="field">Contact email<input type="text" id="esEmail" maxlength="100" placeholder="optional" value="${esc(s.contact_email || "")}"></label>
    <label class="field">Phone<input type="text" id="esPhone" maxlength="20" placeholder="optional" value="${esc(s.phone || "")}"></label>
    <label class="field">Dollar value of 1 point<input type="number" id="esRate" min="0.01" max="1000" step="0.01" required value="${esc(s.point_dollar_rate)}"></label>
    <p id="esErr" role="alert" style="margin:0;color:var(--red)"></p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn go" value="ok">Save changes</button></div>`;
  form.onsubmit = async e => {
    if (e.submitter?.value !== "ok") return;
    e.preventDefault(); e.submitter.disabled = true;
    const body = { sponsor_name: $("#esName").value.trim(), contact_email: $("#esEmail").value.trim(),
                   phone: $("#esPhone").value.trim(), point_dollar_rate: $("#esRate").value };
    try {
      if (LIVE) await App.api(`/api/admin/sponsors/${s.sponsor_id}`, { method: "PATCH", body });
      else Object.assign(sponsor(s.sponsor_id), body, { point_dollar_rate: +body.point_dollar_rate });
      form.onsubmit = null; dlg.close(); toast("Changes saved"); App.render();
    } catch (err) { $("#esErr").textContent = err.message; e.submitter.disabled = false; }
  };
  dlg.showModal();
}

bind.admin.sponsors = () => {
  const find = id => sponsorRows.find(s => s.sponsor_id === id);
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => setSponsorStatus(find(+b.dataset.st)));
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editSponsorDialog(find(+b.dataset.edit)));
  $("#addSponsor").onclick = addSponsorDialog;
};

// POST /api/admin/sponsors. The dialog stays open on an error so the admin can fix the form.
function addSponsorDialog(){
  const form = $("#dlgBody"), dlg = $("#dlg");
  form.innerHTML = `<h2 style="margin:0">Add sponsor</h2>
    <label class="field">Company name<input type="text" id="spName" maxlength="100" required></label>
    <label class="field">Contact email<input type="text" id="spEmail" maxlength="100" placeholder="optional"></label>
    <label class="field">Phone<input type="text" id="spPhone" maxlength="20" placeholder="optional"></label>
    <label class="field">Dollar value of 1 point<input type="number" id="spRate" min="0.01" max="1000" step="0.01" value="0.01" required></label>
    <p id="spErr" role="alert" style="margin:0;color:var(--red)"></p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn go" value="ok">Create sponsor</button></div>`;
  form.onsubmit = async e => {
    if (e.submitter?.value !== "ok") return;
    e.preventDefault();
    const body = { sponsor_name: $("#spName").value.trim(), contact_email: $("#spEmail").value.trim(),
                   phone: $("#spPhone").value.trim(), point_dollar_rate: $("#spRate").value };
    e.submitter.disabled = true;
    try {
      if (LIVE) await App.api("/api/admin/sponsors", { method: "POST", body });
      else DB.sponsor_organization.push({ sponsor_id: nextId("sponsor_organization","sponsor_id"), sponsor_name: body.sponsor_name,
        status: "ACTIVE", point_dollar_rate: +body.point_dollar_rate, contact_email: body.contact_email || null, phone: body.phone || null, created_at: now() });
      form.onsubmit = null; dlg.close();
      toast(`${body.sponsor_name} added`);
      App.refresh();
    } catch (err) { $("#spErr").textContent = err.message; e.submitter.disabled = false; }
  };
  dlg.showModal();
  $("#spName").focus();
}

App.start("admin", "sponsors");
</script>
</body>
</html>
