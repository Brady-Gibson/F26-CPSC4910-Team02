<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audit log · TigerTruck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
#auditFilters input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-width:0}
:root[data-theme=dark] #auditFilters input[type=date]{color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) #auditFilters input[type=date]{color-scheme:dark}}
#auditError{color:var(--red)}
#auditError:empty{display:none}
</style>
</head>
<body data-root="../">
<div class="shell"><aside class="rail" id="rail"></aside><main id="main" tabindex="-1"><div class="loading">Loading…</div></main></div>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgBody"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin-audit.js"></script>
</body>
</html>
