<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales reports · TigerTruck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../">
<div class="shell"><aside class="rail" id="rail"></aside><main id="main" tabindex="-1"><div class="loading">Loading…</div></main></div>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgBody"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
VIEWS.admin.reports = () => { const live=DB.customer_order.filter(o=>o.status!=="CANCELLED");
  const by=DB.sponsor_organization.map(s=>({s,os:live.filter(o=>o.sponsor_id===s.sponsor_id)})).map(x=>({...x,usd:x.os.reduce((a,o)=>a+o.total_dollar_amount,0)}));
  const max=Math.max(1,...by.map(b=>b.usd));
  return `<div class="head"><div><h1>Sales reports</h1><p class="sub">Dollar value of redemptions by sponsor, for invoicing. Cancelled orders are excluded.</p></div></div>
  <div class="grid g3" style="margin-bottom:18px"><div class="panel"><div class="dim">Orders</div><div class="stat">${live.length}</div></div><div class="panel"><div class="dim">Sales</div><div class="stat">${usd(live.reduce((a,o)=>a+o.total_dollar_amount,0))}</div></div><div class="panel"><div class="dim">Points redeemed</div><div class="stat">${n(live.reduce((a,o)=>a+o.total_points,0))}</div></div></div>
  <div class="panel">${by.map(b=>`<div style="margin-bottom:12px"><div class="row spread"><b>${esc(b.s.sponsor_name)}</b><span>${usd(b.usd)} · ${b.os.length} orders</span></div><div class="bar"><i style="width:${b.usd/max*100}%"></i></div></div>`).join("")}
  ${src("customer_order","order_item","sponsor_organization")}</div>`; };

App.start("admin", "reports");
</script>
</body>
</html>
