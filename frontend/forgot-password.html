<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Forgot password · TigerTruck</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css"></head>
<body class="auth" data-root=""><aside class="auth-side"><div class="brand"><img class="shield" src="assets/img/logo.png" alt="Tiger Trucking logo"></div><div class="sign auth-sign"><div class="sign-in"><div class="sign-label">Good Driver Incentive Program</div><h1>Drive safe. Earn points. Get rewards.</h1><p>Your sponsor rewards safe, on-time driving with points you can spend in their catalog.</p></div></div><div class="auth-note">Team 02 · CPSC 4910 · <a href="about.html">About this project</a></div></aside><main class="auth-main"><div class="auth-card"><h2>Forgot password</h2><p class="dim">Enter your account email and we'll send a reset link.</p><form id="form"><div class="auth-err" id="message" role="status" aria-live="polite"></div><label class="field">Email address<input id="email" type="email" autocomplete="email" required></label><button class="btn go" id="submit" type="submit">Send reset link</button></form><p style="margin-top:16px"><a href="login.html">Back to sign in</a></p></div></main><script>document.getElementById("form").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("submit"),m=document.getElementById("message");b.disabled=true;m.textContent="";try{const r=await fetch("/api/password-reset/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value})});const d=await r.json();m.textContent=d.message||d.error||"Unable to send request."}catch{m.textContent="Unable to connect. Please try again."}finally{b.disabled=false}};</script></body></html>
