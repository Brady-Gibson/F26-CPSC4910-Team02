<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recover password · TigerTruck</title><link rel="stylesheet" href="assets/css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>.auth-card select{width:100%;padding:11px 12px;font-size:16px}.auth-card [role="alert"]:empty,.auth-card [role="status"]:empty{display:none}</style></head>
<body class="auth"><aside class="auth-side"><div class="brand"><img class="shield" src="assets/img/logo.png" alt="Tiger Trucking logo"></div>
<div class="sign auth-sign"><div class="sign-in"><div class="sign-label">Good Driver Incentive Program</div><h1>Drive safe. Earn points. Get rewards.</h1><p>Recover access to your account.</p></div></div>
<div class="auth-note">Team 02 · CPSC 4910</div></aside>
<main class="auth-main"><div class="auth-card"><h2>Forgot password?</h2><p class="dim">Answer the two questions you previously set up in your profile.</p>
<p id="message" role="alert" aria-live="polite"></p>
<form id="lookup"><label class="field">Username or email<input type="text" id="username" autocomplete="username" required maxlength="100"></label><button class="btn go">Continue</button></form>
<form id="verify" hidden><div id="questions"></div><button class="btn go">Verify answers</button></form>
<form id="reset" hidden><label class="field">New password<input id="newPw" type="password" autocomplete="new-password" required></label>
<label class="field">Confirm new password<input id="confirmPw" type="password" autocomplete="new-password" required></label>
<button class="btn go">Reset password</button></form>
<p><a href="login.html">Back to sign in</a></p></div></main>
<script>
const $ = id => document.getElementById(id);
let token = "";
async function send(path, body) {
 const response = await fetch("/api/security-questions/"+path,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(body)});
 const data=await response.json();if(!response.ok)throw Error(data.error||"Something went wrong.");return data;
}
function message(text){$("message").textContent=text;}
$("lookup").onsubmit=async e=>{e.preventDefault();message("");
 try{const data=await send("lookup",{username:$("username").value.trim()});
 if(!data.configured){message(data.message);return;}
 $("questions").replaceChildren();
 data.questions.forEach((question,i)=>{const label=document.createElement("label");label.className="field";label.textContent=question;
 const input=document.createElement("input");input.type="text";input.required=true;input.autocomplete="off";input.dataset.answer=i;label.append(input);$("questions").append(label);});
 $("lookup").hidden=true;$("verify").hidden=false;
 }catch(err){message(err.message);}};
$("verify").onsubmit=async e=>{e.preventDefault();message("");
 try{const answers=[...document.querySelectorAll("[data-answer]")].map(el=>el.value);
 const data=await send("verify",{username:$("username").value.trim(),answers});token=data.token;
 $("verify").hidden=true;$("reset").hidden=false;message("Verified. Choose your new password within 10 minutes.");
 }catch(err){message(err.message);}};
$("reset").onsubmit=async e=>{e.preventDefault();message("");
 try{const data=await send("reset",{token,new_password:$("newPw").value,confirm_password:$("confirmPw").value});
 token="";$("reset").hidden=true;message(data.message+" Return to sign in.");
 }catch(err){message(err.message);}};
</script></body></html>
