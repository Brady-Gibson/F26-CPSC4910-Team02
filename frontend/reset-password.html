<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reset password · TigerTruck</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css"></head>
<body class="auth" data-root=""><aside class="auth-side"><div class="brand"><img class="shield" src="assets/img/logo.png" alt="Tiger Trucking logo"></div><div class="sign auth-sign"><div class="sign-in"><div class="sign-label">Good Driver Incentive Program</div><h1>Drive safe. Earn points. Get rewards.</h1><p>Your sponsor rewards safe, on-time driving with points you can spend in their catalog.</p></div></div><div class="auth-note">Team 02 · CPSC 4910 · <a href="about.html">About this project</a></div></aside><main class="auth-main"><div class="auth-card"><h2>Reset password</h2><p class="dim">Choose a new password for your account.</p><form id="form"><div class="auth-err" id="message" role="status" aria-live="polite"></div><label class="field">New password<input id="password" type="password" autocomplete="new-password" required></label><label class="field">Confirm new password<input id="confirm" type="password" autocomplete="new-password" required></label><button class="btn go" id="submit" type="submit">Update password</button></form><p style="margin-top:16px"><a href="login.html">Back to sign in</a></p></div></main><script>const token=new URLSearchParams(location.search).get("token");if(!token)document.getElementById("message").textContent="Missing reset link. Request a new one.";history.replaceState(null,"",location.pathname);document.getElementById("form").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("submit"),m=document.getElementById("message");if(!token)return;b.disabled=true;m.textContent="";try{const r=await fetch("/api/password-reset/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,new_password:document.getElementById("password").value,confirm_password:document.getElementById("confirm").value})});const d=await r.json();m.textContent=d.message||d.error||"Unable to update password.";if(r.ok){document.getElementById("form").reset();b.hidden=true}}catch{m.textContent="Unable to connect. Please try again."}finally{b.disabled=false}};</script></body></html>
