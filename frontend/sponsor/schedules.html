<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recurring points · TigerTruck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../">
<div class="shell"><aside class="rail" id="rail"></aside><main id="main" tabindex="-1"><div class="loading">Loading…</div></main></div>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgBody"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
VIEWS.sponsor.schedules = () => {
  const sid=mySponsor(), rs=DB.recurring_point_schedule.filter(r=>r.sponsor_id===sid), ds=DB.driver.filter(d=>d.sponsor_id===sid&&d.participation_status==="ACTIVE");
  return `<div class="head"><div><h1>Recurring points</h1><p class="sub">Award points on a schedule instead of by hand.</p></div></div>
  <div class="grid g2"><div class="panel flush"><div class="tw"><table><thead><tr><th>Driver</th><th>Reason</th><th>Every</th><th class="num">Points</th><th>Next run</th><th></th></tr></thead><tbody>
  ${rs.map(r=>`<tr><td>${esc(uname(r.driver_id))}</td><td>${esc(r.reason)}</td><td>${esc(r.frequency.toLowerCase())}</td><td class="num plus">+${n(r.points_amount)}</td><td>${r.is_active?fmtD(r.next_run_at):badge("INACTIVE")}</td>
   <td><button class="btn ghost sm" data-tog="${r.schedule_id}">${r.is_active?"Pause":"Resume"}</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">No schedules yet.</td></tr>`}</tbody></table></div></div>
  <div class="panel"><h2>New schedule</h2><div class="grid" style="gap:12px">
    <label class="field">Driver<select id="sd">${ds.map(d=>`<option value="${d.driver_id}">${esc(uname(d.driver_id))}</option>`).join("")}</select></label>
    <label class="field">Points<input type="number" id="sp" value="500" min="1"></label>
    <label class="field">Frequency<select id="sf"><option>WEEKLY</option><option selected>MONTHLY</option><option>DAILY</option></select></label>
    <label class="field">Reason<input type="text" id="sr" value="Monthly safe-driving bonus"></label>
    <button class="btn go" id="addS">Create schedule</button></div>${src("recurring_point_schedule")}</div></div>`;
};

bind.sponsor.schedules = () => {
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const r=DB.recurring_point_schedule.find(x=>x.schedule_id===+b.dataset.tog); r.is_active=!r.is_active; App.render();});
  $("#addS").onclick=()=>{ DB.recurring_point_schedule.push({schedule_id:nextId("recurring_point_schedule","schedule_id"),driver_id:+$("#sd").value,sponsor_id:mySponsor(),created_by_user_id:ME.sponsor,points_amount:+$("#sp").value,reason:$("#sr").value,frequency:$("#sf").value,next_run_at:"2026-10-24 10:00",is_active:true}); toast("Schedule created"); App.render(); };
};

App.start("sponsor", "schedules");
</script>
</body>
</html>
