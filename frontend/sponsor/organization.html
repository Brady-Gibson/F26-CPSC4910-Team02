<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organization · TigerTruck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="../">
<div class="shell"><aside class="rail" id="rail"></aside><main id="main" tabindex="-1"><div class="loading">Loading…</div></main></div>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgBody"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
/* LIVE: GET /api/sponsor/organization, PATCH /api/sponsor/organization {point_dollar_rate, contact_email, phone}
   Invite sponsor user: POST /api/sponsor/organization/users */

function mockOrganization(){
  const s = sponsor(mySponsor());
  return { organization: s, team: DB.sponsor_user.filter(x=>x.sponsor_id===s.sponsor_id).map(t=>{ const u=user(t.sponsor_user_id);
    return { ...t, first_name:u.first_name, last_name:u.last_name, email:u.email, account_status:u.account_status }; }) };
}

VIEWS.sponsor.organization = async () => {
  const { organization: s, team } = LIVE ? await App.api("/api/sponsor/organization") : mockOrganization();
  return `<div class="head"><div><h1>${esc(s.sponsor_name)}</h1><p class="sub">Organization settings and your sponsor team.</p></div></div>
  <div class="grid g2"><div class="panel"><div class="grid" style="gap:12px">
    <label class="field">Dollar value of 1 point<input type="number" step="0.01" min="0.01" id="rate" value="${s.point_dollar_rate}"></label>
    <label class="field">Contact email<input type="email" id="ce" value="${esc(s.contact_email)}"></label>
    <label class="field">Phone<input type="tel" id="cp" value="${esc(s.phone)}"></label>
    <button class="btn go" id="saveO">Save changes</button></div>${src("sponsor_organization")}</div>
  <div class="panel flush"><h2>Team</h2><div class="list">${team.map(t=>`<div class="li"><div><b>${esc(t.first_name)} ${esc(t.last_name)}</b><br><span class="dim">${t.job_title?esc(t.job_title)+" · ":""}${esc(t.email)}</span></div>${badge(t.account_status)}</div>`).join("")}</div>
  <div style="padding:0 18px 16px"><button class="btn ghost" id="inviteUser">Invite sponsor user</button>${src("sponsor_user","user_account")}</div></div></div>`;
};

async function saveOrganization(){
  const body = { point_dollar_rate: $("#rate").value.trim(), contact_email: $("#ce").value.trim(), phone: $("#cp").value.trim() };
  if (LIVE) {
    try { await App.api("/api/sponsor/organization", { method: "PATCH", body }); toast("Changes saved"); App.render(); }
    catch (e) { toast(e.message); }
    return;
  }
  Object.assign(sponsor(mySponsor()), { ...body, point_dollar_rate: +body.point_dollar_rate }); toast("Changes saved");
}

function updateInviteRules(){
  const v = $("#su_pass").value;
  const checks = { length: Array.from(v).length >= 8, upper: /[A-Z]/.test(v), lower: /[a-z]/.test(v),
                   number: /[0-9]/.test(v), symbol: /[^A-Za-z0-9]/.test(v) };
  document.querySelectorAll("#su_pwRules li").forEach(li => {
    const met = checks[li.dataset.rule];
    li.classList.toggle("is-met", met);
    li.querySelector(".requirement-icon").textContent = met ? "✓" : "○";
    li.querySelector(".requirement-status").textContent = met ? ": met" : ": not met";
  });
}

function inviteDialog(){
  $("#dlgBody").innerHTML = `<h2>Invite a sponsor user</h2>
    <p class="dim">They join your organization as a sponsor user right away. Share the temporary password with them.</p>
    <div class="grid g2" style="gap:12px"><label class="field">First name<input type="text" id="su_first" required></label>
      <label class="field">Last name<input type="text" id="su_last" required></label></div>
    <label class="field">Email<input type="email" id="su_email" required></label>
    <div class="grid g2" style="gap:12px"><label class="field">Phone (optional)<input type="tel" id="su_phone"></label>
      <label class="field">Job title (optional)<input type="text" id="su_title" maxlength="100"></label></div>
    <label class="field">Username<input type="text" id="su_user" required autocomplete="off"></label>
    <label class="field">Temporary password<span class="pw" style="display:block"><input type="password" id="su_pass" style="width:100%" required autocomplete="new-password" aria-describedby="su_pwRules">
      <button type="button" id="su_showPw" aria-label="Show password">Show</button></span></label>
    <ul id="su_pwRules" class="password-checklist" aria-label="Password requirements">
      <li data-rule="length"><span class="requirement-icon" aria-hidden="true">○</span>At least 8 characters<span class="requirement-status">: not met</span></li>
      <li data-rule="upper"><span class="requirement-icon" aria-hidden="true">○</span>Uppercase letter<span class="requirement-status">: not met</span></li>
      <li data-rule="lower"><span class="requirement-icon" aria-hidden="true">○</span>Lowercase letter<span class="requirement-status">: not met</span></li>
      <li data-rule="number"><span class="requirement-icon" aria-hidden="true">○</span>Number<span class="requirement-status">: not met</span></li>
      <li data-rule="symbol"><span class="requirement-icon" aria-hidden="true">○</span>Symbol<span class="requirement-status">: not met</span></li>
    </ul>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn go" value="ok">Add sponsor user</button></div>`;
  $("#su_showPw").onclick = () => {   // hide the password by default, with a Show/Hide toggle like the login page
    const p = $("#su_pass"), show = p.type === "password";
    p.type = show ? "text" : "password";
    $("#su_showPw").textContent = show ? "Hide" : "Show";
    $("#su_showPw").setAttribute("aria-label", show ? "Hide password" : "Show password");
  };
  $("#su_pass").oninput = updateInviteRules;   // same checklist as the register page
  const dlg = $("#dlg"); dlg.showModal();
  dlg.onclose = async () => {
    if (dlg.returnValue !== "ok") return;
    if (!LIVE) return toast("Adding sponsor users needs the live server.");
    const body = { first_name: $("#su_first").value, last_name: $("#su_last").value, email: $("#su_email").value,
                   phone: $("#su_phone").value, job_title: $("#su_title").value,
                   username: $("#su_user").value, password: $("#su_pass").value };
    try { await App.api("/api/sponsor/organization/users", { method: "POST", body }); toast(`${body.first_name} added to your team`); App.render(); }
    catch (err) {   // reopen with what they typed so they can fix it
      toast(err.message); inviteDialog();
      const ids = { first_name:"first", last_name:"last", email:"email", phone:"phone", job_title:"title", username:"user", password:"pass" };
      for (const [k, id] of Object.entries(ids)) $("#su_"+id).value = body[k]; updateInviteRules();
    }
  };
}

bind.sponsor.organization = () => { $("#saveO").onclick = saveOrganization; $("#inviteUser").onclick = inviteDialog; };

App.start("sponsor", "organization");
</script>
</body>
</html>
